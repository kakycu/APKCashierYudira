name: Compilar APK ChashierYudira

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar assets web con Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar ChashierYudira.apk
        run: cp android/app/build/outputs/apk/debug/ChashierYudira.apk ChashierYudira.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ChashierYudira
          path: ChashierYudira.apk
          if-no-files-found: error
