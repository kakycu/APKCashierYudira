name: Compilar APK ChashierYudira

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(which sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list_installed | grep 'platforms;android-' || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "build-tools;36.0.0" || true

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar assets web con Android
        run: npx cap sync android

      - name: Preparar firma estable
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cashier-release.jks"

      - name: Compilar APK firmada
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/cashier-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(which sdkmanager)"
          PLATFORM=$("$SDKMANAGER" --list_installed | grep -o 'platforms;android-[0-9]*' | sed 's/.*-//' | sort -n | tail -1)
          echo "compileSdk detectada: $PLATFORM"
          ./gradlew assembleRelease -PciCompileSdk=$PLATFORM --no-daemon

      - name: Preparar ChashierYudira.apk
        run: cp android/app/build/outputs/apk/release/ChashierYudira.apk ChashierYudira.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ChashierYudira
          path: ChashierYudira.apk
          if-no-files-found: error

      - name: Leer versión
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión detectada: $VERSION"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ChashierYudira.apk --clobber
            gh release edit "$TAG" --title "ChashierYudira v$VERSION"
          else
            gh release create "$TAG" ChashierYudira.apk \
              --title "ChashierYudira v$VERSION" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
