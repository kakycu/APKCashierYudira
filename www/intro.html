<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#071018">
<title>Entrar al Cashier de Yudira</title>
<link rel="icon" href="icons/cashier.png">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<style>
  :root{
    --cian:#00d4ff;--fuego:#ff6a00;--texto:#eaf2fa;--muted:#b8c7d9;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --safe-left:env(safe-area-inset-left, 0px);
    --safe-right:env(safe-area-inset-right, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    position:relative;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    color:var(--texto);overflow:hidden;
    background:
      radial-gradient(circle at 50% 40%, rgba(0,212,255,.08), transparent 45%),
      radial-gradient(circle at 50% 60%, rgba(255,106,0,.08), transparent 50%),
      linear-gradient(180deg,#0b1a2b 0%,#060d17 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(40px + var(--safe-bottom)) calc(16px + var(--safe-left));
    text-align:center;
  }
  .intro{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}

  /* Escenario idéntico al original para el círculo. */
  .stage{position:relative;width:min(86vw,520px);aspect-ratio:1;flex-shrink:0}
  .halo{
    position:absolute;inset:10%;border-radius:50%;
    background:radial-gradient(circle,rgba(0,212,255,.18),rgba(0,212,255,0) 65%);
    filter:blur(2px);opacity:.8;
  }
  .capa{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(.88) translateY(12px);
    transition:opacity .6s ease, transform .7s cubic-bezier(.2,.8,.2,1);
    will-change:opacity,transform;pointer-events:none;
  }
  .capa.is-on{opacity:1;transform:scale(1) translateY(0)}
  .capa img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
  .circulo{z-index:1}
  .circulo img{
    width:100%;height:100%;
    filter:drop-shadow(0 12px 30px rgba(0,0,0,.35));
  }

  /* Después, el unicornio más pequeño, flotando detrás de la foto. */
  .unicornio{z-index:2;padding-top:5%}
  .unicornio img{width:54%;height:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4))}
  .unicornio.is-on img{animation:flotar 2.8s ease-in-out 1.8s infinite alternate}
  /* Tras caer Yudira, el unicornio sube y se coloca encima del círculo. */
  .unicornio.sube{z-index:4;animation:subirUnicornio .9s cubic-bezier(.2,.8,.2,1) both}
  .unicornio.sube img{
    filter:drop-shadow(0 0 5px rgba(255,255,255,1))
           drop-shadow(0 0 14px rgba(0,212,255,.95))
           drop-shadow(0 10px 28px rgba(0,212,255,.7));
  }

  /* Yudira entra grande desde arriba y se asienta pequeña en el centro del círculo. */
  .foto{z-index:3;opacity:1;transform:none;transition:none}
  .foto-movil{
    position:relative;width:72%;height:86%;opacity:0;
    transform:translateY(-78vh) scale(1.55);
  }
  .foto.is-on .foto-movil{animation:caerYudira 1.75s cubic-bezier(.18,.82,.22,1) both}
  .foto-movil img{
    width:100%;height:100%;object-fit:contain;
    background:transparent;border:0;outline:0;
    filter:drop-shadow(0 16px 32px rgba(0,0,0,.55));
  }
  .foto.is-on .foto-movil img{animation:respirar 3s ease-in-out 2s infinite}
  .sheen{
    position:absolute;inset:0;opacity:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.65) 48%,transparent 66%);
    background-size:220% 100%;background-position:135% 0;mix-blend-mode:screen;
    -webkit-mask-image:url('anim/Yudira.png');mask-image:url('anim/Yudira.png');
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
  }
  .foto.brilla .sheen{animation:introSheen 1.4s cubic-bezier(.4,0,.5,1) 2 both}

  @keyframes flotar{from{transform:translateY(6px) scale(1)}to{transform:translateY(-10px) scale(1.03)}}
  @keyframes subirUnicornio{
    from{transform:scale(1) translateY(8%)}
    to{transform:scale(.82) translateY(-68%)}
  }
  @keyframes caerYudira{
    0%{opacity:0;transform:translateY(-78vh) scale(1.55)}
    16%{opacity:1}
    70%{transform:translateY(5%) scale(.93)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes respirar{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
  @keyframes introSheen{0%{opacity:0;background-position:135% 0}18%{opacity:1}100%{opacity:0;background-position:-45% 0}}

  .marca{font-size:clamp(20px,5vw,30px);font-weight:800;letter-spacing:.04em;line-height:1.2}
  .marca span{background:linear-gradient(90deg,var(--cian),var(--fuego));-webkit-background-clip:text;background-clip:text;color:transparent}
  .subtitulo{margin-top:6px;font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}

  .entrar{
    margin-top:4px;min-height:52px;padding:0 26px;border:0;border-radius:15px;
    background:linear-gradient(90deg,#00a8cc,#007ea7);color:#fff;
    font-family:inherit;font-size:14px;font-weight:800;letter-spacing:.03em;
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    cursor:pointer;box-shadow:0 10px 28px rgba(0,168,204,.32);
    transition:transform .18s ease,box-shadow .25s ease,filter .25s ease;
  }
  .entrar i{font-size:16px}
  .entrar:hover{filter:brightness(1.08);box-shadow:0 14px 34px rgba(0,168,204,.45)}
  .entrar:active{transform:scale(.98)}
  .entrar:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .pie{font-size:10.5px;color:var(--muted);opacity:.8}

  .credito{
    margin-top:2px;display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:10.5px;color:#dbeafe;letter-spacing:.02em;
  }
  .credito-texto{display:flex;flex-direction:column;align-items:center;line-height:1.35}
  .credito-texto small{font-size:11px;color:#cbd5e1;opacity:.95}
  .credito img{
    width:26px;height:auto;
    filter:brightness(0) invert(1);
  }

  .marca,.subtitulo,.entrar,.pie,.credito{opacity:0;transform:translateY(10px)}
  .intro.listos .marca,.intro.listos .subtitulo,.intro.listos .entrar,.intro.listos .pie,.intro.listos .credito{
    opacity:1;transform:translateY(0);
    transition:opacity .55s ease,transform .55s ease;
  }
  .intro.listos .marca{transition-delay:.05s}
  .intro.listos .subtitulo{transition-delay:.12s}
  .intro.listos .entrar{transition-delay:.2s}
  .intro.listos .pie{transition-delay:.28s}
  .intro.listos .credito{transition-delay:.36s}

  /* Barra de progreso como en la animación original. */
  .barra{
    position:absolute;left:50%;bottom:max(2.25rem,5vh);transform:translateX(-50%);
    width:min(76vw,480px);height:3px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;
  }
  .barra span{
    display:block;width:0;height:100%;
    background:linear-gradient(90deg,var(--cian),var(--fuego));
    transition:width .35s ease;
  }

  @media (max-width:520px){.barra{bottom:max(1.25rem,3vh);width:min(82vw,360px)}}
  @media (max-height:700px){
    .stage{width:min(60vh,330px)}
    .intro{gap:9px}
    .entrar{min-height:46px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .foto-movil{opacity:1;transform:none}
    .unicornio.sube{transform:scale(.82) translateY(-68%)}
    .marca,.subtitulo,.entrar,.pie,.credito{opacity:1;transform:none}
  }
</style>
</head>
<body>
  <main class="intro" id="introAnim">
    <div class="stage" aria-label="Animación de entrada">
      <div class="halo" aria-hidden="true"></div>
      <div class="capa circulo" id="capaCirculo" aria-hidden="true"><img src="anim/01_Circulo.png" alt="" decoding="async"></div>
      <div class="capa unicornio" id="capaUnicornio" aria-hidden="true"><img src="anim/02_Unicornio.png" alt="" decoding="async"></div>
      <div class="capa foto" id="capaFoto">
        <div class="foto-movil">
          <img src="anim/Yudira.png" alt="Yudira" decoding="async">
          <span class="sheen" aria-hidden="true"></span>
        </div>
      </div>
    </div>

    <div>
      <h1 class="marca">CASHIER DE <span>YUDIRA</span></h1>
      <p class="subtitulo">Calculadora de billetes</p>
    </div>

    <button type="button" class="entrar" id="entrarBtn"><i class="fas fa-arrow-right"></i> ENTRAR AL CASHIER DE YUDIRA</button>
    <p class="pie">Versión 2.0.1 · 100 % local</p>
    <div class="credito">
      <img src="anim/02_Unicornio.png" alt="" aria-hidden="true">
      <div class="credito-texto">
        <span>© Unicornio Software® - 2026</span>
        <small>En colaboración con MiPyMe "Visiones"</small>
      </div>
    </div>
  </main>

  <div class="barra" aria-hidden="true"><span id="barraProgreso"></span></div>

  <script>
  (function(){
    var intro = document.getElementById('introAnim');
    var circulo = document.getElementById('capaCirculo');
    var unicornio = document.getElementById('capaUnicornio');
    var foto = document.getElementById('capaFoto');
    var barra = document.getElementById('barraProgreso');
    var reducido = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function pintar(paso){ barra.style.width = (paso * 100 / 3) + '%'; }
    function listo(){ intro.classList.add('listos'); pintar(3); }

    document.getElementById('entrarBtn').addEventListener('click', function(){
      try { sessionStorage.setItem('cashier_entered', '1'); } catch(e){}
      window.location.href = 'index.html';
    });

    if(reducido){
      circulo.classList.add('is-on');
      unicornio.classList.add('is-on');
      unicornio.classList.add('sube');
      foto.classList.add('is-on');
      listo();
      return;
    }

    /* 1. Círculo: misma entrada que la animación original. */
    setTimeout(function(){ circulo.classList.add('is-on'); pintar(1); }, 220);
    /* 2. Unicornio pequeño, después del círculo. */
    setTimeout(function(){ unicornio.classList.add('is-on'); pintar(2); }, 1040);
    /* 3. Yudira cae desde arriba y queda centrada dentro del círculo. */
    setTimeout(function(){ foto.classList.add('is-on'); }, 1780);
    setTimeout(function(){
      foto.classList.add('brilla');
      unicornio.classList.add('sube');
      listo();
    }, 3560);
  })();
  </script>
</body>
</html>
